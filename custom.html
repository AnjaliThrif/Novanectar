<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="custom.css" />
  <title>Customization | Lillian Jewellers</title>
</head>
<body>
  <header></header>

  <div class="customization-container">
    <h1 class="page-title">Jewelry Customization Options</h1>
<form action="shop.html" method="get">
    <!--Ankle Wear -->
    <div class="category">
      <h2 class="category-title">Ankle Wear</h2>
      <div class="options">
        <label>Metal:
          <select>
            <option>Rose Gold</option>
            <option>Yellow Gold</option>
            <option>White Gold</option>
            <option>Platinum</option>
            <option>Sterling Silver</option>
            <option>Titanium</option>
          </select>
        </label>

        <label>Length (inches):
          <input type="number" min="6" max="14" step="0.5" />
        </label>

        <label>Charms:
            <select>
                <option>Sapphire</option>
                <option>Turquoise</option>
                <option>Heart Symbol</option>
                <option>Initial Tag</option>
            </select>
          </label>

        <label>Engraving:
          <input type="text" maxlength="15" placeholder="Max 15 characters" />
        </label>
      </div>
    <button class="submit-btn">Submit Customization</button>
</div>

    <!--Bangles -->
    <div class="category">
        <h2 class="category-title">Bangles</h2>
        <div class="options">
          <label>Metal:
            <select>
              <option>Rose Gold</option>
              <option>Yellow Gold</option>
              <option>White Gold</option>
              <option>Platinum</option>
              <option>Sterling Silver</option>
              <option>Titanium</option>
            </select>
          </label>
  
          <label>Size:
            <input type="number" min="6" max="14" step="0.5" placeholder="(in cms)" />
          </label>
  
          <label>Charms:
            <select>
                <option>Sapphire</option>
                <option>Turquoise</option>
                <option>Heart Symbol</option>
                <option>Initial Tag</option>
            </select>
          </label>

          <label>Engraving | Stone Setting:
            <input type="text" maxlength="15" placeholder="Max 15 characters" />
          </label>

          <label>Stone Accents:
            <select>
            <option>Diamonds</option>
              <option>Cubic Zirconia (CZ)</option>
              <option>Swarovski Crystals</option>
              <option>Pearls</option>
              <option>Sapphires</option>
              <option>Rubies</option>
              <option>Topaz</option>
            </select>
          </label>

          <label>Finish:
            <input type="text" maxlength="15" placeholder="Max 15 characters" />
          </label>
        </div>
      <button class="submit-btn">Submit Customization</button>
    </div>
  
    <!--Bracelets -->
    <div class="category">
        <h2 class="category-title">Bracelets</h2>
        <div class="options">
          <label>Metal:
            <select>
              <option>Rose Gold</option>
              <option>Yellow Gold</option>
              <option>White Gold</option>
              <option>Platinum</option>
              <option>Sterling Silver</option>
              <option>Titanium</option>
            </select>
          </label>
  
          <label>Clasp Style:
            <select>
              <option>Lobster Clasp</option>
              <option>Spring Ring Clasp</option>
              <option>Toggle Clasp</option>
              <option>Magnetic Clasp</option>
              <option>Hook Clasp</option>
              <option>Barrel Clasp</option>
              <option>Slide Lock Clasp</option>
              <option>Adjustable Slide Knot</option>
              <option>Box Clasp</option>
            </select>
          </label>

            <label>Charms:
                <select>
                    <option>Sapphire</option>
                    <option>Turquoise</option>
                    <option>Heart Symbol</option>
                    <option>Initial Tag</option>
                </select>
              </label>

              <label>Stone Accents:
                <select>
                <option>Diamonds</option>
                  <option>Cubic Zirconia (CZ)</option>
                  <option>Swarovski Crystals</option>
                  <option>Pearls</option>
                  <option>Sapphires</option>
                  <option>Rubies</option>
                  <option>Topaz</option>
                </select>
              </label>

              <label>Bracelet Style:
                <select>
                  <option>Chain Bracelets</option>
                  <option>Bangle Bracelets</option>
                  <option>Cuff Bracelets</option>
                  <option>Beaded Bracelets (Stretch)</option>
                  <option>Charm Bracelets</option>
                  <option>Clasp Type</option>
                </select>
              </label>

              <label>Stone Setting:
                <select>
                  <option>Pavé Setting</option>
                  <option>Channel Setting</option>
                  <option>Prong Setting</option>
                  <option>Bezel Setting</option>
                  <option>Invisible Setting</option>
                  <option>Scattered Accents</option>
                  <option>Accenting Links</option>
                </select>
              </label>
    
          <label>Engraving | Stone Setting:
            <input type="text" maxlength="15" placeholder="Max 15 characters" class="text1" />
          </label>
        </div>
      <button class="submit-btn">Submit Customization</button>
    </div>

    <!--Brooches -->
    <div class="category">
        <h2 class="category-title">Brooches</h2>
        <div class="options">
          <label>Metal:
            <select>
              <option>Rose Gold</option>
              <option>Yellow Gold</option>
              <option>White Gold</option>
              <option>Platinum</option>
              <option>Sterling Silver</option>
              <option>Titanium</option>
            </select>
          </label>
  
          <label>Stone Accents:
            <select>
            <option>Diamonds</option>
              <option>Cubic Zirconia (CZ)</option>
              <option>Swarovski Crystals</option>
              <option>Pearls</option>
              <option>Sapphires</option>
              <option>Rubies</option>
              <option>Topaz</option>
            </select>
          </label>
  
          <label>Stone Setting:
            <select>
              <option>Pavé Setting</option>
              <option>Channel Setting</option>
              <option>Prong Setting</option>
              <option>Bezel Setting</option>
              <option>Invisible Setting</option>
              <option>Scattered Accents</option>
              <option>Accenting Links</option>
            </select>
          </label>
  
          <label>Engraving | Finish:
            <input type="text" maxlength="15" placeholder="Max 15 characters" />
          </label>
        </div>
      <button class="submit-btn">Submit Customization</button>
    </div>

    <!--Chains -->
    <div class="category">
        <h2 class="category-title">Chains</h2>
        <div class="options">
          <label>Metal:
            <select>
              <option>Rose Gold</option>
              <option>Yellow Gold</option>
              <option>White Gold</option>
              <option>Platinum</option>
              <option>Sterling Silver</option>
              <option>Titanium</option>
            </select>
          </label>
  
          <label>Length (inches):
            <input type="number" min="6" max="14" step="0.5" />
          </label>
    
          <label>Link Style:
            <select>
              <option>Cable Chain</option>
              <option>Curb Chain</option>
              <option>Figaro Chain</option>
              <option>Rolo Chain</option>
              <option>Ball Chain (or Bead Chain)</option>
              <option>Snake Chain</option>
              <option>Mariner Chain</option>
              <option>Herringbone Chain</option>
              <option>Birdcage Chain</option>
              <option>Rope Chain</option>
            </select>
          </label>
  
          <label>Thickness:
            <input type="text" maxlength="15" placeholder="Thin, Thick, Medium" />
          </label>
        </div>
      <button class="submit-btn">Submit Customization</button>
    </div>

    <!--Ear Cuffs -->
    <div class="category">
        <h2 class="category-title">Ear Cuffs</h2>
        <div class="options">
          <label>Metal:
            <select>
              <option>Rose Gold</option>
              <option>Yellow Gold</option>
              <option>White Gold</option>
              <option>Platinum</option>
              <option>Sterling Silver</option>
              <option>Titanium</option>
            </select>
          </label>
  
          <label>Stone Accents:
            <select>
            <option>Diamonds</option>
              <option>Cubic Zirconia (CZ)</option>
              <option>Swarovski Crystals</option>
              <option>Pearls</option>
              <option>Sapphires</option>
              <option>Rubies</option>
              <option>Topaz</option>
            </select>
          </label>
  
          <label>Style:
            <select>
              <option>Hoop Ear Cuffs</option>
              <option>Band/Wrap Ear Cuffs</option>
              <option>Chain Ear Cuffs</option>
              <option>Cuff with Dangling Elements</option>
              <option>Statement Ear Cuffs</option>
              <option>Minimalist Ear Cuffs</option>
              <option>Adjustable Ear Cuffs</option>
              <option>Pearl Ear Cuffs</option>
              <option>Nature-Inspired Ear Cuffs</option>
            </select>
          </label>
  
          <label>Finish:
            <input type="text" maxlength="15" placeholder="Max 15 characters" />
          </label>
        </div>
      <button class="submit-btn">Submit Customization</button>
    </div>

    <!--Earrings -->
        <div class="category">
            <h2 class="category-title">Earrings</h2>
            <div class="options">
              <label>Metal:
                <select>
                  <option>Rose Gold</option>
                  <option>Yellow Gold</option>
                  <option>White Gold</option>
                  <option>Platinum</option>
                  <option>Sterling Silver</option>
                  <option>Titanium</option>
                </select>
              </label>
      
              <label>Stone Accents:
                <select>
                <option>Diamonds</option>
                  <option>Cubic Zirconia (CZ)</option>
                  <option>Swarovski Crystals</option>
                  <option>Pearls</option>
                  <option>Sapphires</option>
                  <option>Rubies</option>
                  <option>Topaz</option>
                </select>
              </label>

              <label>Stone Shape/Cut:
                <select>
                  <option>Round Brilliant Cut</option>
                  <option>Round Cabochon</option>
                  <option>Oval Brilliant</option>
                  <option>Oval Cabochon</option>
                  <option>Square Princess Cut</option>
                  <option>Square Cushion Cut</option>
                  <option>Square Asscher Cut</option>
                  <option>Rectangular Emerald Cut</option>
                  <option>Rectangular Radiant Cut</option>
                  <option>Rectangular Baguette Cut</option>
                  <option>Pear Shape (or Teardrop)</option>
                  <option>Pear Cabochon</option>
                  <option>Marquise Shape (or Navette)</option>
                  <option>Heart Shape</option>
                  <option>Briolette</option>
                  <option>Marquise Cabochon</option>
                </select>
              </label>

      
              <label>Stone Setting:
                <select>
                  <option>Pavé Setting</option>
                  <option>Channel Setting</option>
                  <option>Prong Setting</option>
                  <option>Bezel Setting</option>
                  <option>Invisible Setting</option>
                  <option>Scattered Accents</option>
                  <option>Accenting Links</option>
                </select>
              </label>
      
              <label>Quantity:
                <select>
                  <option>1</option>
                  <option>2</option>
                  <option>3</option>
                  <option>4</option>
                  <option>5</option>
                </select>
              </label>

              <label>Engraving:
                <input type="text" maxlength="15" placeholder="Small engraving (e.g., stud backs)." />
              </label>

              <label>Dangle Length:
                <select>
                  <option>Short Dangle (Subtle Drop)</option>
                  <option>Medium Dangle (Noticeable Swing)</option>
                  <option>Long Dangle (Eye-Catching Movement)</option>
                  <option>Extra-Long Dangle (Shoulder Grazers)</option>
                </select>
              </label>
              </div>
          <button class="submit-btn">Submit Customization</button>
        </div>
    
    <!--Finger Rings -->
    <div class="category">
        <h2 class="category-title">Finger Rings</h2>
        <div class="options">
          <label>Metal:
            <select>
              <option>Rose Gold</option>
              <option>Yellow Gold</option>
              <option>White Gold</option>
              <option>Platinum</option>
              <option>Sterling Silver</option>
              <option>Titanium</option>
            </select>
          </label>

          <label>Ring Size:
            <input type="number" placeholder="Max size - 12">
        </label>

          <label>Center Stone:
            <select>
            <option>Diamond</option>
              <option>Cubic Zirconia (CZ)</option>
              <option>Swarovski Crystal</option>
              <option>Pearl</option>
              <option>Sapphire</option>
              <option>Ruby</option>
              <option>Topaz</option>
            </select>
          </label>

          <label>Stone Setting:
            <select>
              <option>Pavé Setting</option>
              <option>Channel Setting</option>
              <option>Prong Setting</option>
              <option>Bezel Setting</option>
              <option>Invisible Setting</option>
              <option>Scattered Accents</option>
              <option>Accenting Links</option>
            </select>
          </label>

          <label>Engraving | Finish:
            <input type="text" maxlength="15" placeholder="Small engraving (e.g., stud backs)." />
          </label>

          <label>Stone Shape/Cut:
            <select>
              <option>Round Brilliant Cut</option>
              <option>Round Cabochon</option>
              <option>Oval Brilliant</option>
              <option>Oval Cabochon</option>
              <option>Square Princess Cut</option>
              <option>Square Cushion Cut</option>
              <option>Square Asscher Cut</option>
              <option>Rectangular Emerald Cut</option>
              <option>Rectangular Radiant Cut</option>
              <option>Rectangular Baguette Cut</option>
              <option>Pear Shape (or Teardrop)</option>
              <option>Pear Cabochon</option>
              <option>Marquise Shape (or Navette)</option>
              <option>Heart Shape</option>
              <option>Briolette</option>
              <option>Marquise Cabochon</option>
            </select>
          </label>


          <label>Band Width:
            <select>
              <option>Very Thin (1mm - 1.5mm)</option>
              <option>Thin (2mm - 2.5mm)</option>
              <option>Medium (3mm - 4mm)</option>
              <option>Wide (5mm - 7mm)</option>
              <option>Very Wide (8mm and above)</option>
            </select>
          </label>

          <label class="style">Band Style:
            <select>
              <option>Plain Band (Classic/Comfort Fit)</option>
              <option>Knife-Edge Band</option>
              <option>Milgrain Band</option>
              <option>Hammered Band</option>
              <option>Braided Band</option>
              <option>Twisted Band</option>
              <option>Channel-Set Band</option>
              <option>Pavé Band</option>
              <option>Eternity Band</option>
              <option>Stacking Bands</option>
            </select>
          </label>
          </div>
      <button class="submit-btn">Submit Customization</button>
    </div>

    <!--Watch Jewelry (Charms for Watch Bands) -->
    <div class="category">
        <h2 class="category-title">Watch Jewelry</h2>
        <div class="options">
          <label>Metal:
            <select>
              <option>Rose Gold</option>
              <option>Yellow Gold</option>
              <option>White Gold</option>
              <option>Platinum</option>
              <option>Sterling Silver</option>
              <option>Titanium</option>
            </select>
          </label>
  
          <label>Stone Accents:
            <select>
            <option>Diamonds</option>
              <option>Cubic Zirconia (CZ)</option>
              <option>Swarovski Crystals</option>
              <option>Pearls</option>
              <option>Sapphires</option>
              <option>Rubies</option>
              <option>Topaz</option>
            </select>
          </label>
    
          <label>Quantity:
            <select>
              <option>Letters & Numbers: (A-Z, 0-9)</option>
              <option> Symbols: (Heart, Star, Infinity, Peace Sign, etc.)</option>
              <option>Nature: (Leaf, Flower, Sun, Moon, Animal silhouettes)</option>
              <option> Geometric: (Circle, Square, Triangle, Hexagon)</option>
              <option>Spiritual/Meaningful: (Hamsa, Evil Eye, Om symbol)</option>
              <option>Zodiac Signs: (Icons for each zodiac sign)</option>
              <option>Shapes: (Abstract shapes, curved forms)</option>
              <option>Spiritual/Meaningful: (Hamsa, Evil Eye, Om symbol)</option>
            </select>
          </label>

          <label>Engraving:
            <input type="text" maxlength="15" placeholder="Small engraving (e.g., stud backs)." />
          </label>
          </div>
      <button class="submit-btn">Submit Customization</button>
    </div>



  </div>
</form>
  <footer></footer>
  <script src="script.js"></script>
</body>
</html>
