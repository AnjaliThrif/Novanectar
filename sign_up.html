<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="footer.css">
<link rel="stylesheet" href="sign_up.css">
<script defer src="script.js"></script>
<title>Sign Up</title>
<body>
    <header></header>
    <div class="signup-container">
        <div class="signup-left">
            <h2>Create an <span>Account</span></h2>
            <p>Create an account to enjoy personalized shopping experience</p>
            <form action="#">
                <div class="name-row">
                    <input type="text" placeholder="First Name..." required>
                    <input type="text" placeholder="Last Name..." required>
                </div>
                <input type="email" placeholder="Enter your email..." required>
                <input type="password" placeholder="Enter your password..." required>
                <input type="password" placeholder="Confirm your password..." required>
                <button type="submit">Create Account</button>
                <p class="signin-text">Already have an account? <a href="login.html">Sign in</a></p>
            </form>
        </div>
        <div class="signup-right">
            <img src="signup-image.png" alt="Modern Interior">
        </div>
    </div>
    <footer></footer>
</body>
