<!DOCTYPE html>
<title>Workout</title>
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="footer.css">
<link rel="stylesheet" href="workout.css">
<header></header>
<body>
    <div class="container">
        <h1>Workout Tracker</h1>
        <div id="workout-form">
            <label for="workout-type">Workout Type:</label>
            <input type="text" id="workout-type" placeholder="e.g., Running, Yoga"><br><br>
            <label for="workout-duration">Duration (minutes):</label>
            <input type="number" id="workout-duration" placeholder="e.g., 30"><br><br>
            <label for="workout-date">Date:</label>
            <input type="date" id="workout-date"><br><br>
            <label for="workout-type">Weight:</label>
            <input type="number" id="workout-type" placeholder="(e.g., 50 KG)"><br><br>
            <button id="add-workout">Add Workout</button><br><br>
        </div>
        <div id="workout-history">
            <h2>Workout History</h2><br>
            <ul id="workout-list"></ul>
            <p id="total-time">Total Workout Time: 0 minutes </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
<script defer src="script.js"></script>
<footer></footer>
</html>
